<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration - Library Management System</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-card" style="max-width: 480px;">
      <div class="auth-header">
        <div class="brand-icon">🎓</div>
        <h2 class="auth-title">Join the Library</h2>
        <p class="auth-subtitle">Create your student or member account</p>
      </div>

      <div class="auth-body">
        <form id="registerForm" onsubmit="handleRegisterSubmit(event)">
          <div class="form-group">
            <label class="form-label" for="fullName">Full Name</label>
            <input type="text" id="fullName" name="fullName" class="form-control" placeholder="e.g. Alex Morgan" required autofocus>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="username">Username</label>
              <input type="text" id="username" name="username" class="form-control" placeholder="e.g. alexm" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="phone">Phone Number</label>
              <input type="tel" id="phone" name="phone" class="form-control" placeholder="+1-555-0123">
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="email">Email Address</label>
            <input type="email" id="email" name="email" class="form-control" placeholder="alex@university.edu" required>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="password">Password</label>
              <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" minlength="4" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="confirmPassword">Confirm Password</label>
              <input type="password" id="confirmPassword" name="confirmPassword" class="form-control" placeholder="••••••••" minlength="4" required>
            </div>
          </div>

          <button type="submit" id="regBtn" class="btn btn-primary" style="width: 100%; padding: 0.75rem; margin-top: 0.5rem;">
            Create Member Account
          </button>
        </form>

        <div style="text-align: center; margin-top: 1.5rem; font-size: 0.85rem; color: var(--gray-600);">
          Already have an account? <a href="login.html" style="font-weight: 600;">Sign in here</a>
        </div>
      </div>
    </div>
  </div>

  <div id="toastContainer" class="toast-container"></div>

  <script src="js/app.js"></script>
  <script>
    async function handleRegisterSubmit(e) {
      e.preventDefault();
      const pass = document.getElementById('password').value;
      const confirmPass = document.getElementById('confirmPassword').value;

      if (pass !== confirmPass) {
        showToast('Passwords do not match', 'error');
        return;
      }

      const btn = document.getElementById('regBtn');
      btn.disabled = true;
      btn.textContent = 'Registering...';

      const data = {
        fullName: document.getElementById('fullName').value.trim(),
        username: document.getElementById('username').value.trim(),
        email: document.getElementById('email').value.trim(),
        phone: document.getElementById('phone').value.trim(),
        password: pass,
        role: 'STUDENT'
      };

      try {
        const res = await API.auth.register(data);
        if (res.success) {
          showToast(res.message, 'success');
          setTimeout(() => {
            window.location.href = res.redirect || 'student-dashboard.html';
          }, 400);
        } else {
          showToast(res.message || 'Registration failed', 'error');
          btn.disabled = false;
          btn.textContent = 'Create Member Account';
        }
      } catch (err) {
        showToast(err.message || 'Server error occurred', 'error');
        btn.disabled = false;
        btn.textContent = 'Create Member Account';
      }
    }
  </script>
</body>
</html>
